<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Subtle Golden Gradient for circle ring -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEB038" />
      <stop offset="50%" stop-color="#C29426" />
      <stop offset="100%" stop-color="#E2B744" />
    </linearGradient>
  </defs>

  <!-- Background circular disc with crisp white fill -->
  <circle cx="256" cy="256" r="236" fill="#FFFFFF" stroke="url(#goldRing)" stroke-width="10" />

  <!-- 1. GINGER / TURMERIC ROOT (Golden-yellow line art) -->
  <g stroke="#EAA414" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top bulbous knob -->
    <path d="M 215 190 C 205 170, 208 145, 230 132 C 252 120, 275 130, 278 155 C 280 175, 270 195, 285 208 C 298 220, 318 215, 335 228 C 352 242, 350 268, 338 285 C 325 302, 305 305, 310 325 C 315 345, 340 348, 355 358 C 368 370, 365 392, 348 402 C 330 412, 305 400, 290 380 C 275 360, 260 365, 240 375 C 220 385, 195 380, 185 360 C 175 340, 178 318, 192 305 C 208 290, 210 270, 195 255 C 180 240, 182 215, 205 200" />
    
    <!-- Knobby segment folds & details -->
    <path d="M 220 162 C 235 158, 258 162, 268 175" />
    <path d="M 205 220 C 225 215, 248 222, 255 240" />
    <path d="M 270 230 C 288 235, 315 245, 325 265" />
    <path d="M 225 295 C 242 290, 268 298, 275 315" />
    <path d="M 295 350 C 310 355, 330 365, 340 380" />
    <path d="M 195 340 C 210 345, 230 348, 245 342" />
  </g>

  <!-- 2. RED CHILI PEPPER (Crimson red line art) -->
  <g stroke="#C62828" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Chili Stem at Top -->
    <path d="M 168 145 C 158 152, 146 168, 150 182" />
    <path d="M 142 178 C 150 174, 160 178, 168 185" />
    
    <!-- Outer Curved Body of Chili -->
    <path d="M 152 184 C 132 215, 126 260, 134 300 C 144 345, 175 375, 220 398 C 265 420, 315 425, 338 418 C 342 416, 345 410, 340 405 C 322 390, 290 365, 245 330 C 205 300, 185 265, 180 225 C 176 198, 180 185, 180 185" />
    
    <!-- Inner Accent Contour Line -->
    <path d="M 148 248 C 152 288, 172 322, 212 355 C 248 382, 285 398, 320 405" stroke-width="8" />
  </g>

  <!-- 3. GREEN LEAF SPRIG (Fresh green line art) -->
  <g stroke="#1E7E34" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Central Curving Stem -->
    <path d="M 252 340 C 275 295, 305 240, 342 168" />
    
    <!-- Leaf 1 (Top / Upper-Left pointing) -->
    <path d="M 320 205 C 298 188, 280 155, 286 122 C 308 126, 332 152, 336 180" />
    <!-- Leaf 1 Midrib -->
    <path d="M 322 200 C 310 178, 300 155, 292 130" stroke-width="6.5" />

    <!-- Leaf 2 (Upper-Right pointing) -->
    <path d="M 338 175 C 342 145, 360 118, 388 108 C 392 135, 382 165, 355 185" />
    <!-- Leaf 2 Midrib -->
    <path d="M 345 170 C 360 152, 372 136, 382 118" stroke-width="6.5" />

    <!-- Leaf 3 (Right pointing) -->
    <path d="M 328 220 C 352 215, 388 208, 420 190 C 405 220, 372 238, 338 238" />
    <!-- Leaf 3 Midrib -->
    <path d="M 332 224 C 360 220, 385 212, 412 196" stroke-width="6.5" />
  </g>
</svg>
