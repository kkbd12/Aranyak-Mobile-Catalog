<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background disc for pure contrast -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" />

  <!-- 1. OUTER GOLDEN CIRCLE -->
  <circle cx="250" cy="250" r="208" fill="none" stroke="#CCA43B" stroke-width="4.5" />

  <!-- 2. GINGER / TURMERIC ROOT (Yellow / Golden-amber line art) -->
  <g stroke="#EEAA1B" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main root outline with rounded organic lobes -->
    <path d="M 188 262 
             C 172 238, 160 205, 172 172 
             C 182 142, 218 126, 244 148 
             C 256 160, 248 185, 258 202 
             C 272 216, 298 206, 316 220 
             C 334 234, 334 256, 322 276 
             C 310 292, 290 294, 294 314 
             C 298 328, 326 334, 342 346 
             C 358 358, 355 382, 336 394 
             C 316 404, 292 392, 282 376 
             C 270 356, 250 358, 232 366 
             C 208 376, 178 366, 170 342 
             C 162 318, 172 292, 188 262 Z" />

    <!-- Lobe crease / segment lines -->
    <!-- Top bulb segment creases -->
    <path d="M 198 178 C 212 170, 230 174, 240 186" />
    <path d="M 206 156 C 218 150, 230 152, 238 162" />

    <!-- Mid-left creases -->
    <path d="M 186 226 C 200 218, 222 222, 232 236" />
    <path d="M 188 246 C 200 240, 216 242, 224 252" />

    <!-- Lower-center and bottom lobe creases -->
    <path d="M 216 308 C 230 302, 252 306, 262 320" />
    <path d="M 284 344 C 298 348, 318 352, 328 366" />
    <path d="M 226 348 C 238 350, 254 346, 264 338" />
  </g>

  <!-- 3. RED CHILI PEPPER (Crimson red line art) -->
  <g stroke="#BE2729" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Chili Stem at top-left -->
    <path d="M 146 142 C 140 152, 134 166, 138 176" />
    <!-- Calyx cap -->
    <path d="M 130 176 C 138 170, 148 172, 154 178" />

    <!-- Outer graceful sweeping curve of the chili pepper -->
    <path d="M 134 178 
             C 118 214, 114 258, 122 298 
             C 132 340, 160 374, 204 396 
             C 248 416, 294 420, 318 410 
             C 322 408, 324 402, 320 398 
             C 298 378, 258 352, 218 318 
             C 178 284, 158 248, 154 214 
             C 150 194, 152 180, 152 180" />

    <!-- Inner contour accent line -->
    <path d="M 136 240 C 140 278, 160 316, 196 348 C 230 374, 268 390, 300 396" stroke-width="4.2" />
  </g>

  <!-- 4. GREEN PLANT LEAF SPRIG (Fresh green line art) -->
  <g stroke="#1A7C3A" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main stem arching across from bottom-center to upper-right -->
    <path d="M 242 328 C 265 284, 292 234, 328 164" />

    <!-- Leaf 1 (Top-Left leaf, pointing up-left) -->
    <path d="M 308 198 C 285 178, 268 142, 276 112 C 298 118, 322 145, 325 175 Z" />
    <!-- Leaf 1 Central Vein -->
    <path d="M 308 195 C 298 172, 288 148, 282 120" stroke-width="3.6" />

    <!-- Leaf 2 (Top-Right leaf, pointing up-right) -->
    <path d="M 326 170 C 330 140, 348 112, 375 102 C 380 130, 370 160, 344 180 Z" />
    <!-- Leaf 2 Central Vein -->
    <path d="M 334 165 C 348 148, 360 132, 370 112" stroke-width="3.6" />

    <!-- Leaf 3 (Lower-Right leaf, pointing right) -->
    <path d="M 316 212 C 340 206, 375 198, 406 182 C 392 210, 360 228, 326 228 Z" />
    <!-- Leaf 3 Central Vein -->
    <path d="M 320 216 C 348 212, 372 204, 398 188" stroke-width="3.6" />
  </g>
</svg>
