<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@600;700&amp;family=Hind+Siliguri:wght@600;700&amp;display=swap');
      .brand-title {
        font-family: 'Noto Serif Bengali', 'Kalpurush', 'SolaimanLipi', 'FreeSerif', 'Lohit Bengali', serif;
        font-size: 52px;
        font-weight: 700;
        fill: #111111;
        text-anchor: middle;
        letter-spacing: 1.5px;
      }
      .brand-tagline {
        font-family: 'Noto Serif Bengali', 'Kalpurush', 'SolaimanLipi', 'FreeSerif', 'Lohit Bengali', serif;
        font-size: 16.5px;
        font-weight: 600;
        fill: #222222;
        text-anchor: middle;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Circular background disc for crisp clean contrast -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" />

  <!-- 1. ELEGANT GOLDEN CIRCLE BORDER -->
  <circle cx="250" cy="250" r="226" fill="none" stroke="#CCA43B" stroke-width="4.5" />

  <!-- 2. GINGER / TURMERIC ROOT (Yellow / Golden line art) -->
  <!-- Scaled and positioned in upper-center region -->
  <g stroke="#EEAA1B" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main root outline with rounded knobby lobes -->
    <path d="M 205 208 
             C 192 188, 182 162, 192 135 
             C 200 111, 228 98, 250 116 
             C 260 126, 253 146, 261 160 
             C 272 171, 294 163, 308 174 
             C 322 186, 323 203, 313 220 
             C 304 233, 287 234, 290 250 
             C 294 262, 316 266, 329 276 
             C 342 286, 339 305, 324 315 
             C 308 323, 288 313, 280 300 
             C 270 284, 255 286, 240 292 
             C 221 300, 197 292, 190 273 
             C 184 254, 192 232, 205 208 Z" />

    <!-- Lobe crease / segment lines -->
    <!-- Top bulb segment creases -->
    <path d="M 212 140 C 224 133, 238 136, 246 146" />
    <path d="M 218 122 C 228 117, 238 119, 244 127" />

    <!-- Mid-left creases -->
    <path d="M 203 179 C 214 172, 232 176, 240 187" />
    <path d="M 205 195 C 214 190, 227 192, 234 200" />

    <!-- Lower-center and bottom lobe creases -->
    <path d="M 227 245 C 238 240, 256 244, 264 255" />
    <path d="M 282 274 C 293 277, 309 280, 317 292" />
    <path d="M 235 277 C 245 279, 257 275, 266 269" />
  </g>

  <!-- 3. RED CHILI PEPPER (Crimson red line art) -->
  <g stroke="#BE2729" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Chili Stem at top-left -->
    <path d="M 171 110 C 166 118, 161 130, 165 137" />
    <!-- Calyx cap -->
    <path d="M 158 137 C 165 132, 173 134, 178 139" />

    <!-- Outer graceful sweeping curve of the chili pepper -->
    <path d="M 162 139 
             C 149 168, 146 203, 152 235 
             C 160 269, 183 296, 218 314 
             C 253 330, 290 333, 309 325 
             C 312 323, 314 318, 311 315 
             C 293 299, 261 278, 229 251 
             C 197 224, 181 195, 178 168 
             C 175 152, 176 141, 176 141" />

    <!-- Inner contour accent line -->
    <path d="M 163 189 C 167 219, 183 250, 211 275 C 239 296, 269 309, 295 314" stroke-width="3.8" />
  </g>

  <!-- 4. GREEN PLANT LEAF SPRIG (Fresh green line art) -->
  <g stroke="#1A7C3A" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main stem arching across from bottom-center to upper-right -->
    <path d="M 248 261 C 266 226, 288 186, 317 130" />

    <!-- Leaf 1 (Top-Left leaf, pointing up-left) -->
    <path d="M 301 157 C 283 141, 269 112, 275 88 C 293 93, 312 115, 315 139 Z" />
    <!-- Leaf 1 Central Vein -->
    <path d="M 301 155 C 293 136, 285 117, 280 94" stroke-width="3.2" />

    <!-- Leaf 2 (Top-Right leaf, pointing up-right) -->
    <path d="M 315 135 C 318 111, 333 88, 354 80 C 358 102, 350 126, 330 142 Z" />
    <!-- Leaf 2 Central Vein -->
    <path d="M 322 131 C 333 117, 342 104, 350 88" stroke-width="3.2" />

    <!-- Leaf 3 (Lower-Right leaf, pointing right) -->
    <path d="M 307 169 C 326 164, 354 157, 379 145 C 368 167, 342 181, 315 181 Z" />
    <!-- Leaf 3 Central Vein -->
    <path d="M 311 171 C 333 168, 352 162, 372 149" stroke-width="3.2" />
  </g>

  <!-- 5. BENGALI BRAND TITLE "আরণ্যক" -->
  <text x="250" y="380" class="brand-title">আরণ্যক</text>

  <!-- 6. BENGALI TAGLINE "অরণ্যের শুদ্ধি, রসুইয়ের সমৃদ্ধি" -->
  <text x="250" y="420" class="brand-tagline">অরণ্যের শুদ্ধি, রসুইয়ের সমৃদ্ধি</text>
</svg>
